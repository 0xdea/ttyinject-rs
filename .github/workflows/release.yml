name: release

permissions:
  contents: read

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  BIN: ttyinject-rs

jobs:
  build-all:
    name: build ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        target:
          # tier 1
          # - x86_64-unknown-linux-gnu
          # - aarch64-unknown-linux-gnu
          # - i686-unknown-linux-gnu

          # tier 2, glibc
          # - arm-unknown-linux-gnueabi
          # - arm-unknown-linux-gnueabihf
          # - armv5te-unknown-linux-gnueabi
          # - armv7-unknown-linux-gnueabi
          # - armv7-unknown-linux-gnueabihf
          # - i586-unknown-linux-gnu
          # - loongarch64-unknown-linux-gnu
          # - powerpc-unknown-linux-gnu
          # - powerpc64-unknown-linux-gnu
          # - powerpc64le-unknown-linux-gnu
          # - riscv64gc-unknown-linux-gnu
          # - s390x-unknown-linux-gnu
          # - sparc64-unknown-linux-gnu
          # - thumbv7neon-unknown-linux-gnueabihf

          # tier 2, musl (statically linked)
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-musl
          - arm-unknown-linux-musleabi
          # - arm-unknown-linux-musleabihf
          - armv5te-unknown-linux-musleabi
          - armv7-unknown-linux-musleabi
          # - armv7-unknown-linux-musleabihf
          - i586-unknown-linux-musl
          # - loongarch64-unknown-linux-musl
          # - riscv64gc-unknown-linux-musl

    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: toolchain
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          target: ${{ matrix.target }}
          cache: false
      - name: dependencies
        uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: cross
      - name: build
        env:
          TARGET: ${{ matrix.target }}
        shell: bash
        run: |
          cross build --release --locked --target "$TARGET"
      - name: package
        env:
          TARGET: ${{ matrix.target }}
        shell: bash
        run: |
          arch="${TARGET%%-unknown-linux-*}"
          abi="${TARGET#*-unknown-linux-}"
          # if [ "$abi" = gnu ]; then
          #   name="${BIN}-linux-${arch}"
          # else
          #   name="${BIN}-linux-${arch}-${abi}"
          # fi
          name="${BIN}-linux-${arch}"
          echo "NAME=$name" >> "$GITHUB_ENV"
          cp "target/${TARGET}/release/${BIN}" "$name"
      - name: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ env.NAME }}
          path: ${{ env.NAME }}

  release:
    name: release
    needs: build-all
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # needed to create the github release and upload assets
    steps:
      - name: download
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          merge-multiple: true
      - name: publish # zizmor: ignore[superfluous-actions]
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: "${{ env.BIN }}-linux-*"
          generate_release_notes: true
