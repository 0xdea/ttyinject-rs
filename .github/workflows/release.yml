name: release

permissions:
  contents: read

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  BIN: ttyinject-rs

jobs:
  build-all:
    name: build ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        target:
          # tier 1
          # - x86_64-unknown-linux-gnu
          # - aarch64-unknown-linux-gnu
          # - i686-unknown-linux-gnu

          # tier 2, glibc
          # - arm-unknown-linux-gnueabi
          # - arm-unknown-linux-gnueabihf
          # - armv5te-unknown-linux-gnueabi
          # - armv7-unknown-linux-gnueabi
          # - armv7-unknown-linux-gnueabihf
          # - i586-unknown-linux-gnu
          # - loongarch64-unknown-linux-gnu
          # - powerpc-unknown-linux-gnu
          # - powerpc64-unknown-linux-gnu
          # - powerpc64le-unknown-linux-gnu
          # - riscv64gc-unknown-linux-gnu
          # - s390x-unknown-linux-gnu
          # - sparc64-unknown-linux-gnu
          # - thumbv7neon-unknown-linux-gnueabihf

          # tier 2, musl (statically linked)
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-musl
          - arm-unknown-linux-musleabi
          # - arm-unknown-linux-musleabihf
          - armv5te-unknown-linux-musleabi
          - armv7-unknown-linux-musleabi
          # - armv7-unknown-linux-musleabihf
          - i586-unknown-linux-musl
          # - loongarch64-unknown-linux-musl
          # - riscv64gc-unknown-linux-musl

    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: toolchain
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          target: ${{ matrix.target }}
          cache: false
      - name: dependencies
        uses: taiki-e/install-action@7f4eb899022d8fe70b20c4f3de697aa85c309026 # v2.85.11
        with:
          tool: cross
      - name: build
        env:
          TARGET: ${{ matrix.target }}
        shell: bash
        run: |
          cross build --release --locked --target "$TARGET"
      - name: package
        env:
          TARGET: ${{ matrix.target }}
        shell: bash
        run: |
          arch="${TARGET%%-unknown-linux-*}"
          abi="${TARGET#*-unknown-linux-}"
          # if [ "$abi" = gnu ]; then
          #   name="${BIN}-linux-${arch}"
          # else
          #   name="${BIN}-linux-${arch}-${abi}"
          # fi
          name="${BIN}-linux-${arch}"
          echo "NAME=$name" >> "$GITHUB_ENV"
          cp "target/${TARGET}/release/${BIN}" "$name"
      - name: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.NAME }}
          path: ${{ env.NAME }}

  release:
    name: release
    needs: build-all
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # needed to create the github release and upload assets
    steps:
      - name: download
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          merge-multiple: true
      - name: publish # zizmor: ignore[superfluous-actions]
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: "${{ env.BIN }}-linux-*"
          generate_release_notes: true
